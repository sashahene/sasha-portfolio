<style>
:root{ --bg:#000; --text:#e9e9ee; --muted:#7a7a85; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.loader{position:fixed;inset:0;display:grid;place-items:center;z-index:5;transition:opacity .8s}
.loader.done{opacity:0;pointer-events:none}
.loader div{width:min(220px,60vw);text-align:center;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.loader .bar{height:1px;background:#222;margin-top:.9rem;overflow:hidden}
.loader .bar i{display:block;height:100%;width:0;background:#cfcfd6;transition:width .2s}
.ctrl{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:.4rem;opacity:0;transition:opacity .4s}
body.awake .ctrl{opacity:1}
.ctrl button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--text);border-radius:999px;
  width:2.4rem;height:2.4rem;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.ctrl button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ctrl svg{width:14px;height:14px;fill:currentColor}
</style>

</div>

<script>
// Silver cuff enclosure model, shared by cuff.html and the diamond-drop film.
// buildCuff(THREE) returns the untransformed model (units: mm, wrist axis = +Z) plus its geometry helpers.
window.buildCuff = function(THREE){
// ---------- Design parameters (mm). Change these to iterate. ----------
const P = {
  innerA: 30,        // interior oval half-width  (60 mm)
  innerB: 25,        // interior oval half-height (50 mm)
  width: 15,         // band width along the wrist
  thick: 6,          // radial thickness
  wall: 1.2,         // shell wall
  gapTarget: 27,     // opening between the ends
  endRound: 4.5,     // how far the rounded end cap reaches
  coverT: 1.0        // removable inner cover thickness
};

// ---------- Ellipse frame helpers ----------
const A = P.innerA, B = P.innerB;
const Z = new THREE.Vector3(0,0,1);
function frame(th){
  const p = new THREE.Vector3(A*Math.cos(th), B*Math.sin(th), 0);
  const t = new THREE.Vector3(-A*Math.sin(th), B*Math.cos(th), 0).normalize();
  const n = new THREE.Vector3(B*Math.cos(th), A*Math.sin(th), 0).normalize();
  return {p,t,n};
}
// arc-length table along the inner oval, s = 0 at the top (th = 90°)
const TAB = [];
(function(){
  const N = 4000; let s = 0, prev = frame(-Math.PI/2).p;
  for (let i=0;i<=N;i++){
    const th = -Math.PI/2 + 2*Math.PI*i/N, p = frame(th).p;
    s += p.distanceTo(prev); prev = p; TAB.push([th,s]);
  }
  const s0 = TAB[N/2][1]; TAB.forEach(r => r[1] -= s0);
})();
function thAt(s){
  let lo=0, hi=TAB.length-1;
  while (hi-lo>1){ const m=(lo+hi)>>1; (TAB[m][1]<s)?lo=m:hi=m; }
  const [t0,s0]=TAB[lo],[t1,s1]=TAB[hi];
  return t0 + (t1-t0)*(s-s0)/((s1-s0)||1);
}
function sAt(th){ return TAB[Math.round((th+Math.PI/2)/(2*Math.PI)*(TAB.length-1))][1]; }

// Superellipse cross-section. u = outward from inner oval, v = along the wrist.
// Different exponents let the outside dome gently while the skin side stays flatter.
function section(uc, hu, hv, nOut, nIn, M){
  const pts=[];
  for (let j=0;j<M;j++){
    const f = 2*Math.PI*j/M, c=Math.cos(f), s=Math.sin(f);
    const n = c>=0 ? nOut : nIn;
    pts.push([uc + hu*Math.sign(c)*Math.pow(Math.abs(c),2/n), hv*Math.sign(s)*Math.pow(Math.abs(s),2/n)]);
  }
  return pts;
}

// Sweep a section along the oval between two arc-length positions, with domed ends.
function sweep(prof, sA, sB, opts={}){
  const seg = opts.seg || Math.max(8, Math.ceil(Math.abs(sB-sA)*1.5));
  const cap = opts.cap ?? 0.6, K = opts.capSeg || 10;
  const uc = prof.reduce((a,p)=>a+p[0],0)/prof.length;
  const M = prof.length, pos=[], idx=[];
  const ring = (fr, adv, dir, scale) => {
    for (const [u,v] of prof){
      const q = fr.p.clone().addScaledVector(fr.t, adv*dir)
        .addScaledVector(fr.n, uc+(u-uc)*scale).addScaledVector(Z, v*scale);
      pos.push(q.x,q.y,q.z);
    }
  };
  const tip = (fr, adv, dir) => {
    const q = fr.p.clone().addScaledVector(fr.t, adv*dir).addScaledVector(fr.n, uc);
    pos.push(q.x,q.y,q.z);
  };
  const fA = frame(thAt(sA)), fB = frame(thAt(sB));
  // start tip + cap rings
  tip(fA, cap, -1);
  for (let k=K-1;k>=1;k--){ const a=k/K*Math.PI/2; ring(fA, cap*Math.sin(a), -1, Math.cos(a)); }
  for (let i=0;i<=seg;i++) ring(frame(thAt(sA+(sB-sA)*i/seg)), 0, 1, 1);
  for (let k=1;k<K;k++){ const a=k/K*Math.PI/2; ring(fB, cap*Math.sin(a), 1, Math.cos(a)); }
  tip(fB, cap, 1);
  const rings = (K-1)*2 + seg + 1, last = 1 + rings*M;
  const R = r => 1 + r*M;
  for (let j=0;j<M;j++){ const j1=(j+1)%M; idx.push(R(0)+j, R(0)+j1, 0); }
  for (let r=0;r<rings-1;r++) for (let j=0;j<M;j++){
    const j1=(j+1)%M, a=R(r)+j, b=R(r+1)+j, c=R(r)+j1, d=R(r+1)+j1;
    idx.push(a,b,c, b,d,c);
  }
  for (let j=0;j<M;j++){ const j1=(j+1)%M; idx.push(R(rings-1)+j, last, R(rings-1)+j1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function volume(g){
  const p=g.attributes.position.array, ix=g.index.array; let v=0;
  for (let i=0;i<ix.length;i+=3){
    const a=ix[i]*3,b=ix[i+1]*3,c=ix[i+2]*3;
    v += p[a]*(p[b+1]*p[c+2]-p[b+2]*p[c+1]) - p[a+1]*(p[b]*p[c+2]-p[b+2]*p[c]) + p[a+2]*(p[b]*p[c+1]-p[b+1]*p[c]);
  }
  return v/6;
}

// ---------- Geometry ----------
// Pick the end angle so the measured gap between the rounded tips matches gapTarget.
const shellProf = section(P.thick/2, P.thick/2, P.width/2, 2.6, 6, 72);
let delta = 0.5;
function gapFor(d){
  const s = sAt(-Math.PI/2+d), f1=frame(thAt(s)), f2=frame(thAt(-s));
  const t1 = f1.p.clone().addScaledVector(f1.t,-P.endRound).addScaledVector(f1.n,P.thick/2);
  const t2 = f2.p.clone().addScaledVector(f2.t, P.endRound).addScaledVector(f2.n,P.thick/2);
  return t1.distanceTo(t2);
}
for (let lo=0.05, hi=1.4, i=0;i<40;i++){ delta=(lo+hi)/2; (gapFor(delta)<P.gapTarget)?lo=delta:hi=delta; }
const sEnd = -sAt(-Math.PI/2+delta);      // ends sit at s = ±sEnd (top is s = 0)

const W = P.wall, cavHu = P.thick/2-W, cavHv = P.width/2-W;
const cavProf  = section(P.thick/2, cavHu, cavHv, 2.6, 6, 48);
const sCav = sEnd - 5;                    // solid end walls ~5 mm before each tip

const group = new THREE.Group();

const silver = new THREE.MeshPhysicalMaterial({color:new THREE.Color(0.97,0.96,0.94), metalness:1, roughness:0.07,
  clearcoat:0.4, clearcoatRoughness:0.05, envMapIntensity:1.15});
const satin  = new THREE.MeshPhysicalMaterial({color:new THREE.Color(0.93,0.92,0.9), metalness:1, roughness:0.32, envMapIntensity:1});
const plain = (hex, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:hex, roughness:.55, metalness:0}, o));

const parts = [];
function add(name, geo, mat, opts={}){
  const m = new THREE.Mesh(geo, mat); m.name = name; group.add(m);
  const rec = Object.assign({name, mesh:m, mat, internal:false}, opts); parts.push(rec); return rec;
}

const shell = add('Outer shell', sweep(shellProf, -sEnd, sEnd, {cap:P.endRound, capSeg:18, seg:420}), silver, {chip:'#d9d9d6', note:'sterling'});
const cavity = add('Internal cavity', sweep(cavProf, -sCav, sCav, {cap:1.2, seg:300}),
  new THREE.MeshStandardMaterial({color:0x6fd2ff, transparent:true, opacity:.16, depthWrite:false, side:THREE.DoubleSide}),
  {internal:true, chip:'#6fd2ff'});

// Inner cover: thin curved panel on the skin side; its seam only exists on the inside.
const coverProf = section(0.5, P.coverT/2+0.03, cavHv+0.3, 8, 8, 40);
const cover = add('Inner cover (removable)', sweep(coverProf, -(sCav-1), sCav-11, {cap:0.5, seg:260}), satin, {chip:'#bdbcb8'});

// Electronics placeholders (simple volumes, NOT real component sizes)
const box = (u0,u1,hv,sA,sB,cap=0.6) => sweep(section((u0+u1)/2,(u1-u0)/2,hv,8,8,32), sA, sB, {cap});
const uIn = W+0.15, uOut = P.thick-W-0.15;
// pulsē layout (s = mm along the band from the top of the wrist). The optical sensor sits on top of the wrist,
// where a cuff presses most firmly against the skin.
add('Flex PCB', box(uIn, uIn+0.15, cavHv-0.6, -(sCav-1.5), sCav-1.5, 0.3), plain(0xd99a2b,{roughness:.4}), {internal:true, chip:'#d99a2b', anchor:-30});
add('Infrared heart-rate sensor', box(uIn+0.35, uIn+1.6, 4.2, -6.5, 6.5), plain(0x8d5bc2), {internal:true, chip:'#8d5bc2', anchor:0});
add('Accelerometer', box(uIn+0.35, uIn+1.1, 1.8, 8, 11.5, 0.3), plain(0x2b9bb5), {internal:true, chip:'#2b9bb5', anchor:9.75});
add('Microcontroller + Bluetooth', box(uIn+0.35, uIn+1.6, cavHv-1.3, 14, 29), plain(0x2f8a5b), {internal:true, chip:'#2f8a5b', anchor:21});
add('Vibration motor (buzz alert)', box(uIn+0.35, uOut-0.2, 4, 33, 42), plain(0x6b6f78,{metalness:.6, roughness:.35}), {internal:true, chip:'#6b6f78', anchor:37.5});
add('Battery (curved LiPo)', box(uIn+0.35, uOut-0.1, cavHv-0.9, -50, -13), plain(0x5b6b8a), {internal:true, chip:'#5b6b8a', anchor:-31});
add('Bluetooth antenna', box(uIn+0.35, uIn+0.9, cavHv-1.5, sCav-9, sCav-1.5, 0.4), plain(0xe14b5a), {internal:true, chip:'#e14b5a', anchor:sCav-5});
// Visible-from-inside features
// Optical window: dark glass the infrared light shines through, with two emitters and a photodiode behind it
const opticalWin = add('Optical window', sweep(section(-0.05,0.12,3.6,8,8,32), -5, 5, {cap:0.8}),
  new THREE.MeshPhysicalMaterial({color:0x0c0d12, metalness:0, roughness:.05, clearcoat:1, clearcoatRoughness:.03}), {chip:'#1a1b22', anchor:0, onCover:true});
(function optics(){
  const led = plain(0x5a0d18, {emissive:0x3a0610, roughness:.3}), pd = plain(0x1d2433, {roughness:.25});
  for (const [sv, mat, r] of [[-2.6, led, 0.8], [0, pd, 1.1], [2.6, led, 0.8]]){
    const fr = frame(thAt(sv)), c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.12, 32), mat);
    c.position.copy(fr.p).addScaledVector(fr.n, -0.1);
    c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), fr.n);
    opticalWin.mesh.add(c);
  }
})();
add('Antenna window (nonmetal)', sweep(section(0.5,P.coverT/2+0.03,cavHv+0.3,8,8,40), sCav-10, sCav-0.5, {cap:0.5}),
  plain(0xfafafa,{roughness:.25}), {chip:'#fafafa', anchor:sCav-5, onCover:true});
(function contacts(){
  const g = new THREE.Group(), mat = plain(0xd4af37,{metalness:1, roughness:.25});
  const fr = frame(thAt(-(sCav-6)));
  for (const v of [-3,3]){
    const c = new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,0.4,32), mat);
    c.position.copy(fr.p).addScaledVector(fr.n,-0.1).addScaledVector(Z,v);
    c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), fr.n);
    g.add(c);
  }
  g.name='Charging contacts'; group.add(g);
  parts.push({name:'Charging contacts', mesh:g, mat, chip:'#d4af37', anchor:-(sCav-6), onCover:true});
})();
// Optional status light ("screen or light system - potential"): a thin frosted light pipe on the side edge,
// so the outer face stays unbroken. Marked optional so it can be switched off.
add('Status light (optional)', sweep(section(P.thick/2, 0.55, 0.14, 8, 8, 24).map(([u,v]) => [u, v + P.width/2 - 0.06]), -16, -6, {cap:0.3}),
  plain(0xe8f4ff, {emissive:0x6fb8ff, emissiveIntensity:.6, roughness:.4}), {chip:'#9fd0ff', anchor:-11, optional:true});

return {P, A, B, Z, frame, thAt, sAt, section, sweep, volume, gapFor, delta, sEnd, sCav, W, cavHu, cavHv,
  shellProf, cavProf, group, parts, shell, cavity, cover, silver, satin};
};
</script>
<!-- cuff-model:end -->
<script type="module">
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

// Scene units are centimetres. The cuff model is in millimetres, so it is scaled by 0.1 and otherwise untouched.
const DUR = 15;
const T = {hold:2.5, impact:6.0, slowEnd:8.6, scatterEnd:11.5, end:DUR};
const rand = (() => { let s = 7; return () => (s = (s*16807) % 2147483647) / 2147483647; })();
const smooth = THREE.MathUtils.smoothstep;

// ---------- Renderer ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});
const DPR = Math.min(devicePixelRatio, 1.75);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.NoToneMapping;          // tone mapping happens in the final pass, after bloom
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const BG = new THREE.Color(0x000000);
scene.background = BG;
const camera = new THREE.PerspectiveCamera(30, 1, 1, 400);

// ---------- Dark studio: softboxes and strips that the silver and the diamonds reflect ----------
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x000000);
function softbox(w,h,lum,pos){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:new THREE.Color(lum,lum,lum), side:THREE.DoubleSide}));
  m.position.set(...pos); m.lookAt(0,0,0); envScene.add(m); return m;
}
softbox(26,26,3.2,[0,46,4]);          // overhead
softbox(7,52,9,[-40,14,22]);          // key strip
softbox(7,52,6,[42,10,-16]);          // fill strip
softbox(64,4,12,[0,22,-44]);          // rim behind
softbox(30,3,1.2,[0,-3,46]);          // low kicker
for (let i=0;i<22;i++){                // small hard lights: these become the diamond sparkle
  const a = rand()*Math.PI*2, e = 0.15 + rand()*1.1, r = 44;
  softbox(1.6,1.6,30+rand()*30,[r*Math.cos(e)*Math.cos(a), r*Math.sin(e), r*Math.cos(e)*Math.sin(a)]);
}
const sweepLight = softbox(5,80,22,[-48,24,0]);
// the stones get their own environment: near-black with many small hard lights, which is what makes facets flash
const gemScene = new THREE.Scene();
gemScene.background = new THREE.Color(0.02,0.02,0.022);
function gemLight(w,h,lum,pos){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:new THREE.Color(lum,lum,lum), side:THREE.DoubleSide}));
  m.position.set(...pos); m.lookAt(0,0,0); gemScene.add(m); return m;
}
for (let i=0;i<120;i++){
  const a = rand()*Math.PI*2, e = -0.2 + rand()*1.6, r = 44, sz = 1 + rand()*2.4;
  gemLight(sz, sz, 20 + rand()*60, [r*Math.cos(e)*Math.cos(a), r*Math.sin(e), r*Math.cos(e)*Math.sin(a)]);
}
for (let i=0;i<14;i++){                // broad dim cards give the stones a silvery body between flashes
  const a = rand()*Math.PI*2, e = rand()*1.2, r = 45;
  gemLight(14, 14, 0.12 + rand()*0.25, [r*Math.cos(e)*Math.cos(a), r*Math.sin(e), r*Math.cos(e)*Math.sin(a)]);
}
gemLight(2,50,14,[-40,14,22]); gemLight(2,50,10,[42,10,-16]); gemLight(50,1.5,16,[0,22,-44]); gemLight(10,10,1.5,[0,46,4]);
sweepLight.visible = false;
const pmrem = new THREE.PMREMGenerator(renderer);
const cubeRT = new THREE.WebGLCubeRenderTarget(512, {type:THREE.HalfFloatType, generateMipmaps:true, minFilter:THREE.LinearMipmapLinearFilter});
const cubeCam = new THREE.CubeCamera(0.1, 100, cubeRT);
let envRT = null;
function updateEnv(){
  const next = pmrem.fromScene(envScene, 0.01);
  scene.environment = next.texture;
  if (envRT) envRT.dispose();
  envRT = next;
}
updateEnv();
cubeCam.update(renderer, gemScene);

// ---------- Lights (shadows + a hint of direct highlight on the metal) ----------
const key = new THREE.SpotLight(0xffffff, 1.6, 0, 0.42, 0.9, 1);
key.position.set(-14, 46, 20); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.bias = -0.0004; key.shadow.camera.near = 20; key.shadow.camera.far = 90;
scene.add(key, key.target);
const rim = new THREE.SpotLight(0xdfe6ff, 1.2, 0, 0.5, 1, 1);
rim.position.set(10, 18, -40); scene.add(rim, rim.target);

// ---------- Dark reflective floor ----------
const mirror = new THREE.Reflector(new THREE.PlaneGeometry(600,600), {
  color:0x4a4a4a, clipBias:0.002, textureWidth:innerWidth*DPR*0.6, textureHeight:innerHeight*DPR*0.6});
mirror.rotation.x = -Math.PI/2; scene.add(mirror);
const dim = new THREE.Mesh(new THREE.PlaneGeometry(600,600), new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  vertexShader:`varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`varying vec3 vW; void main(){ float d = length(vW.xz); gl_FragColor = vec4(0.,0.,0., mix(.45, 1., smoothstep(14., 70., d))); }`
}));
dim.rotation.x = -Math.PI/2; dim.position.y = 0.01; scene.add(dim);
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(600,600), new THREE.ShadowMaterial({opacity:.75}));
shadowCatcher.rotation.x = -Math.PI/2; shadowCatcher.position.y = 0.02; shadowCatcher.receiveShadow = true; scene.add(shadowCatcher);
const mirrorRender = mirror.onBeforeRender;
mirror.onBeforeRender = function(...a){
  if (scene.overrideMaterial) return;                 // skip during the depth-of-field depth pass
  dim.visible = shadowCatcher.visible = false;
  mirrorRender.apply(this, a);
  dim.visible = shadowCatcher.visible = true;
};

// A dark dome under the pile gives the stones a mound to rest on (it is hidden beneath them)
const DOME = {R:12, y:-9.4};
const dome = new THREE.Mesh(new THREE.SphereGeometry(DOME.R, 96, 48, 0, Math.PI*2, 0, 0.66),
  new THREE.MeshBasicMaterial({color:0x000000}));
dome.position.y = DOME.y; dome.receiveShadow = true; scene.add(dome);

// ---------- The cuff: the exact shared model ----------
const M = buildCuff(THREE);
M.parts.forEach(p => { if (p.internal || p.optional) p.mesh.visible = false; });   // the film keeps its original look
M.group.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });

// Collision proxy: overlapping spheres that follow the band (physics only, never drawn).
// Sphere contacts are cannon's most robust, which matters for a heavy object arriving fast.
const proxy = [];
(function(){
  const mm = 0.1, r = M.P.thick/2*mm, sE = M.sEnd + M.P.endRound*0.4;
  const N = Math.ceil(2*sE*mm/0.38);

      vec3 c = aces(texture2D(tDiffuse, vUv).rgb * exposure);
      c = pow(c, vec3(1./2.2));
      c *= mix(1., smoothstep(.85, .2, length(vUv-.5)), .6);
      c += (h(vUv*1000. + time) - .5) * .014;
      gl_FragColor = vec4(c * fade, 1.);
    }`
});
composer.addPass(finish);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w/h; camera.fov = w/h < 1 ? 42 : 30; camera.updateProjectionMatrix();
  mirror.getRenderTarget().setSize(w*DPR*0.6, h*DPR*0.6);
  depthRT.setSize(w*DPR, h*DPR);
  dof.uniforms.res.value.set(w*DPR, h*DPR);
  dof.uniforms.maxCoC.value = 0.009*h*DPR;
  dof.uniforms.aperture.value = 2.2*dof.uniforms.maxCoC.value;
}
addEventListener('resize', resize); resize();

// ---------- Run ----------
let playing = true, clockT = 0, last = performance.now();
const bPlay = document.getElementById('b-play'), iPlay = document.getElementById('i-play');
const setIcon = () => { iPlay.innerHTML = playing ? '<path d="M4 2h3v12H4zM9 2h3v12H9z"/>' : '<path d="M4 2l10 6-10 6z"/>'; bPlay.setAttribute('aria-label', playing ? 'Pause' : 'Play'); };
bPlay.onclick = () => { playing = !playing; setIcon(); };
document.getElementById('b-replay').onclick = () => { clockT = 0; camInit = false; playing = true; setIcon(); };
addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); bPlay.click(); } });
let idle; addEventListener('pointermove', () => { document.body.classList.add('awake'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.remove('awake'), 2200); });

function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (playing) clockT += dt;
  if (clockT >= DUR){ clockT = 0; camInit = false; }
  applyFrame(clockT);
  if (!window.__film?.dbg.freeze) direct(clockT, playing ? dt : 0);
  finish.uniforms.fade.value = smooth(clockT, 0, 0.9) * (1 - smooth(clockT, DUR-0.7, DUR));
  finish.uniforms.time.value = now*0.001;
  scene.overrideMaterial = depthMat; scene.background = null;      // empty pixels must read as far away
  renderer.setClearColor(0xffffff, 1);
  renderer.setRenderTarget(depthRT); renderer.render(scene, camera);
  renderer.setRenderTarget(null); scene.overrideMaterial = null; scene.background = BG;
  renderer.setClearColor(0x000000, 1);
  composer.render();
}

await bake();
buildTimeline();
setupInstances();
document.getElementById('loader').classList.add('done');
window.__film = {tImpact, pileTop, bakeMs, settleMs, frames: frames.length, seek: t => { clockT = t; camInit = false; }, pause: () => { playing = false; setIcon(); },
  dbg: {scene, camera, inst, diamonds, frames, cuff, brilliant, diamondMat, composer, bloom, bokeh, finish, freeze:false}};
last = performance.now();
requestAnimationFrame(loop);
</script>
